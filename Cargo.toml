# Harbor - Local Desktop App Framework
#
# This is both a Rust package (Harbor) and a Cargo workspace
# The workspace includes Rigging (symlinked from ../rigging/)

[workspace]
resolver = "2"
members = [
    "rigging",
]

# Shared dependency versions across all workspace members
[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP and networking
hyper = { version = "1.4", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
http-body-util = "0.1"
tower-service = "0.3"
url = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4", features = ["derive"] }

# Platform-specific
nix = { version = "0.29", features = ["process", "signal"] }
ctrlc = "3.4"

# Rigging (workspace member via symlink)
rigging = { path = "rigging", default-features = false }

[package]
name = "harbor"
version = "0.1.0"
edition = "2021"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
description = "Local desktop app framework - web frontends connecting to gunicorn/nginx over Unix sockets (Linux) or named pipes (Windows)"
repository = "https://github.com/marctjones/harbor"
keywords = ["servo", "desktop-app", "unix-socket", "named-pipe", "gunicorn", "nginx"]
categories = ["gui", "web-programming"]

[[bin]]
name = "harbor"
path = "src/main.rs"

[lib]
name = "harbor"
path = "src/lib.rs"

[[example]]
name = "test-window"
path = "examples/test-window.rs"

[[example]]
name = "test-direct-fetch"
path = "examples/test_direct_fetch.rs"

[features]
default = ["unix", "servo"]
unix = []
named-pipe = []
# Enable embedded Servo browser engine
# Disable with: cargo build --no-default-features --features unix
servo = []

[dependencies]
# Rigging provides the stable embedding API for Servo
# Harbor uses ONLY Unix sockets - NO TCP networking allowed
# This ensures Harbor apps cannot access the internet
rigging = { workspace = true, default-features = false, features = ["unix", "servo"] }

# Configuration
toml = { workspace = true }
serde = { workspace = true }

# Async runtime
tokio = { workspace = true }

# HTTP client (for examples)
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# CLI
clap = { workspace = true }

# Signal handling
ctrlc = { workspace = true }

# Windowing (for examples)
winit = "0.30"

# Process management
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[profile.dev]
# Faster builds for development
opt-level = 0
debug = true

[profile.release]
# Optimize for size and performance
opt-level = 3
lto = true
codegen-units = 1
strip = true
